<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 875" width="700" height="875" role="img" aria-labelledby="studioTitle studioDesc">
  <title id="studioTitle">Studio arch with a gold sphere</title>
  <desc id="studioDesc">Artwork of a sunlit archway, a pedestal with a gold sphere, and a silhouetted branch in a dark studio interior.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19191D"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D791"/>
      <stop offset="0.42" stop-color="#D8A35E"/>
      <stop offset="0.74" stop-color="#C07A55"/>
      <stop offset="1" stop-color="#7A3C34"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF0BF"/>
      <stop offset="0.45" stop-color="#D8B25E"/>
      <stop offset="1" stop-color="#6F4D18"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D8B25E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D8B25E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="700" height="875" fill="url(#wall)"/>

  <path d="M170 660V330a180 180 0 0 1 360 0v330Z" fill="url(#sunset)"/>
  <path d="M170 660V330a180 180 0 0 1 360 0v330" fill="none" stroke="#F4EFE6" stroke-opacity="0.16"/>
  <path d="M200 660V342a150 150 0 0 1 300 0v318" fill="none" stroke="#F4EFE6" stroke-opacity="0.12"/>
  <path d="M170 660h360" stroke="#F4EFE6" stroke-opacity="0.14"/>

  <g stroke="#F4EFE6" stroke-opacity="0.06">
    <path d="M0 660h700M0 875h700"/>
    <path d="M170 660 40 875M530 660 660 875M350 660v215"/>
    <path d="M100 760h500M70 820h560"/>
  </g>

  <rect x="0" y="660" width="700" height="215" fill="#0B0B0D" opacity="0.55"/>

  <ellipse cx="350" cy="652" rx="120" ry="16" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <g>
    <ellipse cx="350" cy="602" rx="52" ry="12" fill="#2A2A30"/>
    <rect x="298" y="602" width="104" height="56" fill="#1C1C21"/>
    <ellipse cx="350" cy="658" rx="52" ry="12" fill="#141418"/>
    <ellipse cx="350" cy="602" rx="52" ry="12" fill="none" stroke="#F4EFE6" stroke-opacity="0.1"/>
  </g>

  <circle cx="350" cy="552" r="58" fill="url(#halo)"/>
  <circle cx="350" cy="552" r="36" fill="url(#sphere)"/>
  <ellipse cx="338" cy="538" rx="12" ry="8" fill="#FFF6D8" opacity="0.5"/>
  <ellipse cx="350" cy="602" rx="36" ry="6" fill="#000000" opacity="0.4"/>

  <g stroke="#B9A48D" stroke-opacity="0.55" fill="none">
    <path d="M568 660c0-90 10-150 28-196"/>
    <path d="M596 500c-26-22-38-50-36-84M598 512c26-18 42-44 46-74M590 552c-22-12-38-30-46-52M592 566c20-6 38-20 50-40"/>
  </g>
  <g fill="#B9A48D" opacity="0.5">
    <ellipse cx="558" cy="412" rx="12" ry="5" transform="rotate(-38 558 412)"/>
    <ellipse cx="648" cy="432" rx="12" ry="5" transform="rotate(28 648 432)"/>
    <ellipse cx="540" cy="494" rx="10" ry="4" transform="rotate(-30 540 494)"/>
    <ellipse cx="646" cy="520" rx="10" ry="4" transform="rotate(18 646 520)"/>
  </g>
  <path d="M556 660h32l-6 44h-20Z" fill="#1A1A1F" stroke="#F4EFE6" stroke-opacity="0.1"/>

  <g fill="#E3C072">
    <circle cx="248" cy="470" r="1.6" opacity="0.55"/>
    <circle cx="452" cy="392" r="1.3" opacity="0.45"/>
    <circle cx="410" cy="300" r="1.1" opacity="0.4"/>
    <circle cx="300" cy="360" r="1" opacity="0.35"/>
    <circle cx="482" cy="540" r="1.4" opacity="0.3"/>
  </g>

  <g stroke="#F4EFE6" stroke-opacity="0.22">
    <path d="M34 34h56M34 34v56M666 34h-56M666 34v56M34 841h56M34 841v-56M666 841h-56M666 841v-56"/>
  </g>

  <text x="52" y="70" fill="#F4EFE6" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3.4">THE STUDIO / 2019</text>
  <text x="52" y="812" fill="#F4EFE6" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3.4">MUMBAI — COPENHAGEN</text>
  <text x="648" y="812" fill="#D8B25E" fill-opacity="0.7" font-family="Georgia, 'Times New Roman', serif" font-size="12" letter-spacing="2" text-anchor="end">A / 26</text>

  <rect width="700" height="875" filter="url(#noise)" opacity="0.15" style="mix-blend-mode:overlay"/>
</svg>
