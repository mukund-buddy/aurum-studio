  <text x="556" y="136" fill="#1B1B19" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2" text-anchor="middle">54.0 M</text>
  <text x="722" y="354" fill="#1B1B19" fill-opacity="0.55" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2" transform="rotate(90 722 354)" text-anchor="middle">32.0 M</text>

  <text x="56" y="118" fill="#1B1B19" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="600" letter-spacing="15">ATLAS</text>
  <text x="60" y="144" fill="#1B1B19" fill-opacity="0.6" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4.2">ARCHITECTURE / URBANISM</text>

  <text x="56" y="514" fill="#1B1B19" fill-opacity="0.7" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Light, material, city.</text>
  <text x="56" y="546" fill="#1B1B19" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2.8">SELECTED WORKS 2004—2024</text>

  <g fill="#1B1B19" fill-opacity="0.4">
    <path d="M60 186h12v1H60zM60 186h1v12h-1z"/>
    <path d="M60 570h12v-1H60zM60 570h1v-12h-1z"/>
