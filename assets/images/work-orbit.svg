<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="orbitTitle">
  <title id="orbitTitle">Orbit fintech product artwork</title>
  <defs>
    <radialGradient id="obg" cx="28%" cy="20%" r="90%">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#080D16"/>
    </radialGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E7CFF"/>
      <stop offset="1" stop-color="#6FE3C1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122036"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4EFE6" opacity="0.09"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#obg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <g fill="none">
    <ellipse cx="560" cy="300" rx="310" ry="126" stroke="#4E7CFF" stroke-opacity="0.22" transform="rotate(-14 560 300)"/>
    <ellipse cx="560" cy="300" rx="360" ry="168" stroke="#6FE3C1" stroke-opacity="0.12" transform="rotate(20 560 300)"/>
    <circle cx="560" cy="300" r="240" stroke="#F4EFE6" stroke-opacity="0.05"/>
  </g>

  <g>
    <rect x="466" y="92" width="212" height="420" rx="30" fill="#0B1524" stroke="#2B3E5C"/>
    <rect x="480" y="106" width="184" height="392" rx="22" fill="url(#screen)"/>
    <rect x="540" y="114" width="64" height="7" rx="3.5" fill="#0A1320"/>
    <text x="504" y="158" fill="#7C93B4" font-family="Arial, Helvetica, sans-serif" font-size="7" letter-spacing="1.6">TOTAL BALANCE</text>
    <text x="504" y="190" fill="#F4EFE6" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing="0.2">$42,890.50</text>
    <rect x="504" y="204" width="58" height="18" rx="9" fill="#123B33"/>
    <text x="514" y="216" fill="#6FE3C1" font-family="Arial, Helvetica, sans-serif" font-size="8">+12.4%</text>
    <path d="M504 316c22-8 34-38 56-34s30 22 48 12 26-38 44-42" fill="none" stroke="url(#chart)" stroke-width="2" stroke-linecap="round"/>
    <path d="M504 316c22-8 34-38 56-34s30 22 48 12 26-38 44-42v72H504Z" fill="#4E7CFF" opacity="0.08"/>
    <g fill="#15253D">
      <rect x="504" y="352" width="140" height="46" rx="10"/>
      <rect x="504" y="408" width="140" height="46" rx="10"/>
    </g>
    <circle cx="522" cy="375" r="10" fill="#1D3556"/>
    <circle cx="522" cy="431" r="10" fill="#1D3556"/>
    <g fill="#F4EFE6" fill-opacity="0.75">
      <rect x="540" y="366" width="48" height="4" rx="2"/>
      <rect x="540" y="376" width="30" height="3" rx="1.5" opacity="0.45"/>
      <rect x="540" y="422" width="54" height="4" rx="2"/>
      <rect x="540" y="432" width="26" height="3" rx="1.5" opacity="0.45"/>
    </g>
    <g fill="#F4EFE6" fill-opacity="0.4">
      <circle cx="526" cy="472" r="3"/>
      <circle cx="560" cy="472" r="3"/>
      <circle cx="594" cy="472" r="3"/>
    </g>
    <rect x="614" y="470" width="28" height="4" rx="2" fill="#6FE3C1" opacity="0.7"/>
  </g>

  <text x="56" y="252" fill="#F4EFE6" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="600" letter-spacing="9">ORBIT</text>
  <text x="60" y="282" fill="#6FE3C1" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4.2">MONEY, IN ORBIT.</text>
  <text x="60" y="322" fill="#A8B6CC" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Banking that moves at your speed.</text>

  <g stroke="#F4EFE6" stroke-opacity="0.16">
    <path d="M60 360h120M60 374h84"/>
  </g>
  <circle cx="60" cy="404" r="3" fill="#D8B25E"/>
  <text x="74" y="408" fill="#F4EFE6" fill-opacity="0.5" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="2.8">PRODUCT / UX / 2025</text>

  <rect width="800" height="600" filter="url(#grain)" opacity="0.13" style="mix-blend-mode:overlay"/>
</svg>
